<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="crystalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
    <radialGradient id="pearlGlow" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#DDD6FE" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#6D28D9" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#8B5CF6" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Glow & Rounded Shape -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#crystalGrad)" filter="url(#shadow)"/>
  <!-- Crystal Sparkle / Facet Star -->
  <path d="M32 14 L36 28 L50 32 L36 36 L32 50 L28 36 L14 32 L28 28 Z" fill="#FFFFFF" fill-opacity="0.95" />
  <!-- Center Pearl Highlight -->
  <circle cx="32" cy="32" r="5" fill="#FFFFFF"/>
  <circle cx="32" cy="32" r="24" fill="url(#pearlGlow)"/>
</svg>
