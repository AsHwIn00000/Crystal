{% extends "base.html" %}
{% block title %}413 File Too Large — Crystal AI{% endblock %}
{% block body_class %}error-page{% endblock %}

{% block content %}
<div class="error-container">
  <div class="error-visual" aria-hidden="true">
    <!-- package / box icon -->
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
  </div>
  <h1 class="error-code">413</h1>
  <h2 class="error-title">File Too Large</h2>
  <p class="error-message">The file you tried to upload exceeds the 50 MB limit. Please use a smaller file.</p>
  <div class="error-actions">
    <a href="javascript:history.back()" class="btn btn-outline">Go Back</a>
    <a href="{{ url_for('pages.documents') }}" class="btn btn-primary">My Documents</a>
  </div>
</div>
{% endblock %}
