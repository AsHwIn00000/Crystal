{% extends "base.html" %}
{% block title %}400 Bad Request — Crystal AI{% endblock %}
{% block body_class %}error-page{% endblock %}

{% block content %}
<div class="error-container">
  <div class="error-visual" aria-hidden="true">
    <!-- alert-circle icon -->
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
  </div>
  <h1 class="error-code">400</h1>
  <h2 class="error-title">Bad Request</h2>
  <p class="error-message">The request could not be understood. Please check your input.</p>
  <div class="error-actions">
    <a href="javascript:history.back()" class="btn btn-outline">Go Back</a>
    <a href="{{ url_for('pages.index') }}" class="btn btn-primary">Home</a>
  </div>
</div>
{% endblock %}
